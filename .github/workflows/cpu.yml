name: CPU verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-cpu.txt
      - run: python -B scripts/verify_publication.py
      - run: python -B scripts/run_public_demo.py --stage smoke
      - run: python -B -m unittest discover -s tests -p test_public_entrypoints.py -v
      - run: python -B scripts/verify_frozen_results.py
